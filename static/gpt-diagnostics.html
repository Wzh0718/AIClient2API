<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F5F7FA">
  <title>GPT 质量检测 · AIClient</title>
  <link rel="stylesheet" href="app/gpt-diagnostics.css">
  <script type="module" src="app/gpt-diagnostics.js"></script>
</head>
<body>
<main>
  <header class="page-header">
    <a class="back" href="request-audit.html">← 返回请求记录</a>
    <div class="heading-row"><h1>GPT 质量检测</h1><span class="eyebrow">凭据诊断</span></div>
    <p class="muted">选择可用凭据，对固定 Codex 模型组逐一执行 ModelTrace 闭集指纹归因。</p>
  </header>

  <section class="panel" aria-labelledby="config-title">
    <div class="section-heading"><h2 id="config-title">检测配置</h2><span id="selection-count" class="muted">尚未选择凭据</span></div>
    <div id="config-error" class="notice error" hidden><span id="config-error-text"></span> <button id="retry-config" class="text-button">重新加载</button></div>
    <div class="config-grid">
      <div class="field picker">
        <label id="credential-label" for="credential-toggle">检测凭据</label>
        <button id="credential-toggle" class="select-button" aria-expanded="false" aria-controls="credential-menu" disabled><span id="credential-summary">正在加载凭据…</span><span aria-hidden="true">⌄</span></button>
        <div id="credential-menu" class="picker-menu" hidden>
          <label class="sr-only" for="credential-search">搜索凭据名称、渠道或 UUID</label>
          <input id="credential-search" type="search" placeholder="搜索名称、渠道或 UUID" autocomplete="off">
          <div class="picker-toolbar"><span class="muted">可勾选多个凭据</span><button id="clear-selection" class="text-button">清空选择</button></div>
          <div id="credential-options" class="credential-options" role="group" aria-labelledby="credential-label"></div>
          <p id="picker-hint" class="muted picker-hint" role="status"></p>
        </div>
        <p class="field-help">固定所选凭据执行，不切换至其他凭据。</p>
      </div>
      <div class="field">
        <label id="fixed-models-label">固定模型组</label>
        <div id="fixed-models" class="model-chips" aria-labelledby="fixed-models-label"><span class="muted">正在加载…</span></div>
        <p class="field-help">每个凭据对以上模型逐一执行指纹检测，无需选择模型。</p>
      </div>
    </div>
    <div id="target-list" class="target-list"></div>
    <div class="tests-line"><span class="muted">检测内容</span><span class="test-tag">ModelTrace 指纹（闭集归因）</span></div>
    <div class="action-bar">
      <div><strong id="budget">正在加载检测预算…</strong><p class="field-help">输出预算为上限，非实际消耗；真实请求按目标串行执行。</p></div>
      <button id="start" class="primary" disabled>开始检测</button>
    </div>
    <p id="submit-status" class="status-message" role="status" aria-live="polite"></p>
  </section>

  <section class="panel" aria-labelledby="current-title">
    <div class="section-heading"><h2 id="current-title" tabindex="-1">当前任务</h2><span class="muted">每 5 秒刷新</span></div>
    <div id="runs-error" class="notice error" hidden><span id="runs-error-text"></span> <button id="retry-runs" class="text-button">重试</button></div>
    <div id="current-runs"><p class="empty">正在加载任务…</p></div>
    <p id="cancel-status" class="status-message" role="status"></p>
  </section>

  <section class="panel history-panel" aria-labelledby="history-title">
    <div class="section-heading"><h2 id="history-title">检测历史</h2><span id="history-count" class="muted"></span></div>
    <div id="history-runs"><p class="empty">正在加载记录…</p></div>
  </section>
  <footer class="page-note">结果仅用于诊断，不会自动停用凭据。ModelTrace 闭集归因不证明模型身份。</footer>
</main>
</body>
</html>
