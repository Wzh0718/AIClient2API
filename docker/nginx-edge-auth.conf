# Include this file from the production http{} block.
# The local edge-auth service listens only on 127.0.0.1 and performs dynamic
# key status / Edge Admission lease checks before traffic reaches Node.
limit_req_zone $binary_remote_addr zone=edge_ip_observe:10m rate=100000r/m;
# Enforcing zone for clients that keep hammering a rejected key. It only takes
# effect where nginx-edge-auth-api-enforce.conf is included instead of
# nginx-edge-auth-api-observe.conf.
limit_req_zone $binary_remote_addr zone=edge_ip_enforce:10m rate=1200r/m;

# The lease plumbing adds eight proxy_set_header entries per protected location,
# which overflows the default header hash and makes nginx drop the configured
# bucket size with a warning on every reload.
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

map $request_uri $edge_auth_required {
    default 0;
    ~^/openai-codex-oauth/v1/ 1;
    ~^/gemini-antigravity/v1/ 1;
    ~^/v1/ 1;
}

map $request_uri $edge_auth_ip_enforce {
    default 0;
}

# Add these directives to the protected API locations in server{}.
# IP enforcement is intentionally disabled in phase one; limit_req_dry_run
# keeps observability.
