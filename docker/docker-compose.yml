services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 1g
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  aiclient-api:
    # 方式一：使用 Docker Hub 预构建镜像（默认，推荐）
    # 使用方法: docker compose up -d
    image: justlikemaki/aiclient-2-api:latest
    container_name: aiclient2api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8085-8087:8085-8087"
      - "1455:1455"
      - "56121:56121"
      - "19876-19880:19876-19880"
    volumes:
      - ./configs:/app/configs
      - ./plugins:/app/src/plugins-user
    environment:
      - ARGS=
      - RUNTIME_MULTI_WORKER_ENABLED=true
      - RUNTIME_EXECUTION_WORKERS=3
      - REDIS_URL=redis://redis:6379/0
      - RUNTIME_DEPLOYMENT_EPOCH=default
      - EDGE_ADMISSION_ENABLED=false
      - EDGE_ADMISSION_REQUIRED=false
      - EDGE_AUTH_INTERNAL_URL=http://127.0.0.1:18081
      - RUNTIME_BIG_OBJECT_BUDGET_BYTES=2147483648
      # Keep each worker below the container memory budget so a runaway request
      # path is rejected by GC pressure instead of an abrupt SIGABRT.
      - NODE_OPTIONS=--max-old-space-size=3072
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
