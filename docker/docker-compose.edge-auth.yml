services:
  edge-auth:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "src/edge-auth/server.js"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:18081"
    environment:
      EDGE_AUTH_HOST: 0.0.0.0
      EDGE_AUTH_PORT: 18081
      EDGE_AUTH_POLICY_FILE: /app/configs/api-potluck-keys.json
      EDGE_AUTH_DEFAULT_KEY_RPM: 100000
      EDGE_AUTH_DEFAULT_KEY_CONCURRENCY: 1000
      EDGE_AUTH_DEFAULT_IP_RPM: 100000
      EDGE_AUTH_IP_ENFORCE: "false"
      EDGE_AUTH_FAIL_OPEN_LOCAL_RPM: 120
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
