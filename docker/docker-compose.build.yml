services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 1g
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  aiclient-api:
    # 方式二：从 Dockerfile 本地构建
    # 使用方法: docker compose -f docker/docker-compose.build.yml -f docker/docker-compose.dev.yml up -d --build
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aiclient2api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8085-8087:8085-8087"
      - "1455:1455"
      - "56121:56121"
      - "19876-19880:19876-19880"
    volumes:
      - ../configs:/app/configs
      - ../plugins:/app/src/plugins-user
    environment:
      - ARGS=
      - RUNTIME_MULTI_WORKER_ENABLED=true
      - RUNTIME_EXECUTION_WORKERS=3
      - REDIS_URL=redis://redis:6379/0
      - RUNTIME_DEPLOYMENT_EPOCH=local
      - RUNTIME_BIG_OBJECT_BUDGET_BYTES=2147483648
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
