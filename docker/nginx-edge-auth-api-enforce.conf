# Optional add-on for nginx-edge-auth-api-location.conf.
# Include this only after deciding to enforce per-IP rate limits: a single
# client sustained ~32 req/s against a rejected key and produced ~50k
# edge-auth 403 subrequests in five minutes, which the dry-run observe zone
# cannot stop. 1200r/m with burst 200 leaves normal clients unaffected.
#
# limit_req_dry_run applies to the whole context rather than to one zone, so the
# dry-run setting inherited from nginx-edge-auth-api-location.conf must be turned
# off here or neither zone would reject anything. The observe zone stays in place
# at 100000r/m, which is far above any real client.
limit_req zone=edge_ip_enforce burst=200 nodelay;
limit_req_dry_run off;
limit_req_status 429;
