# Enforcing per-IP limiting. Include after nginx-edge-auth-api-location.conf
# instead of nginx-edge-auth-api-observe.conf.
#
# A single client sustained ~32 req/s against a rejected key and produced ~50k
# edge-auth 403 subrequests in five minutes, which a dry-run zone cannot stop.
# 1200r/m with burst 200 leaves normal clients unaffected; the observe zone stays
# as a far-above-real-traffic backstop at 100000r/m.
limit_req zone=edge_ip_observe burst=10000 nodelay;
limit_req zone=edge_ip_enforce burst=200 nodelay;
limit_req_status 429;
