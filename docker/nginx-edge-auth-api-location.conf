# Include these directives in each API location that should be protected.
# auth_request returns 403 for rate violations and sets the
# x-edge-response-status header to 429 because standard auth_request only
# treats 2xx/401/403 subrequest statuses as normal authorization outcomes.
#
# Per-IP rate limiting lives in a separate add-on so that the choice between
# observing and enforcing is explicit: include exactly one of
# nginx-edge-auth-api-observe.conf or nginx-edge-auth-api-enforce.conf after
# this file. They cannot be combined, because limit_req_dry_run may appear only
# once per context.
auth_request /_edge_auth;
auth_request_set $edge_key_hash $upstream_http_x_edge_key_hash;
auth_request_set $edge_lease_id $upstream_http_x_edge_lease_id;
auth_request_set $edge_lease_mode $upstream_http_x_edge_lease_mode;
auth_request_set $edge_request_id $upstream_http_x_edge_request_id;
proxy_set_header X-Edge-Key-Hash "";
proxy_set_header X-Edge-Lease-ID "";
proxy_set_header X-Edge-Lease-Mode "";
proxy_set_header X-Edge-Request-ID "";
proxy_set_header X-Edge-Key-Hash $edge_key_hash;
proxy_set_header X-Edge-Lease-ID $edge_lease_id;
proxy_set_header X-Edge-Lease-Mode $edge_lease_mode;
proxy_set_header X-Edge-Request-ID $edge_request_id;
